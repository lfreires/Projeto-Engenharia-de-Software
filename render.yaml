services:
  - type: web
    name: docai
    runtime: docker
    plan: free
    branch: render-deploy
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BEARER_TOKEN
        value: dev-token
      - key: INTERNAL_SERVICE_TOKEN
        value: internal-query-token
      - key: PRIMARY_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: FALLBACK_LLM_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"

  - type: web
    name: docai-frontend
    runtime: static
    branch: render-deploy
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://docai-v8qm.onrender.com
      - key: VITE_PROJECT_ID
        value: proj-demo
      - key: VITE_BEARER_TOKEN
        value: dev-token
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
